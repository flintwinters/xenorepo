name: kanban
title: Kanban
module: apps.kanban.backend.server
capabilities:
  - database
imports:
  - monotools.orchestration.management
  - monotools.runtime.appkit
  - monotools.runtime.application
  - monotools.runtime.http
  - "monoui"
testing:
  python: tests
  browser:
    suite: tests/e2e/readiness.spec.ts
    proofs: [acceptance]
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
