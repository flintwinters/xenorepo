name: rps
title: Rock Paper Scissors
module: apps.rps.backend.server
capabilities:
  - database
  - realtime
imports:
  - monotools.appkit
  - monotools.auth
  - monotools.database
  - monotools.http
  - monotools.management
  - monotools.orm
  - monotools.realtime
  - monotools.runtime
frontend:
  artifacts:
    index:
      format: lit
      source: frontend/index.js
      output: index.html
  routes:
    /: index
