name: xenoview
title: Xenorepo Cockpit
module: apps.xenoview.backend.server
capabilities:
  - database
imports:
  - monotools.orchestration.apps
  - monotools.orchestration.management
  - monotools.orchestration.services
  - monotools.provisioning.audit
  - monotools.runtime.appkit
  - monotools.runtime.application
  - monotools.runtime.http
  - "monoui"
testing:
  python: tests
  browser:
    suite: tests/e2e/cockpit.spec.ts
    proofs: [acceptance, visual]
    input_modalities: [mouse]
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
