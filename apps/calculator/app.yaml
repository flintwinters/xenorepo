name: calculator
title: Calculator
module: apps.calculator.backend.server
capabilities:
  - monoform
imports:
  - monotools.orchestration.management
  - monotools.runtime.application
  - monotools.runtime.http
  - monotools.runtime.monoform
testing:
  python: tests
  browser:
    suite: tests/e2e/readiness.spec.ts
    proofs: [acceptance, visual]
frontend:
  artifacts:
    index:
      format: monoform
      operations:
        - calculate
      output: index.html
  routes:
    /: index
