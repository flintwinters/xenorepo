name: mailing_list
title: Dispatch Ledger
module: apps.mailing_list.backend.server
capabilities:
  - database
imports:
  - monotools.integrations.commerce
  - monotools.integrations.mailer
  - monotools.integrations.stripe
  - monotools.orchestration.management
  - monotools.persistence.database
  - monotools.runtime.appkit
  - monotools.runtime.application
  - monotools.runtime.http
  - "monoui"
testing:
  python: tests
  browser:
    suite: tests/e2e/enrollment.spec.ts
    proofs: [acceptance, visual]
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
