name: chat
title: Common Room
module: apps.chat.backend.server
capabilities:
  - database
  - realtime
imports:
  - monotools.orchestration.management
  - monotools.persistence.database
  - monotools.persistence.orm
  - monotools.runtime.appkit
  - monotools.runtime.application
  - monotools.runtime.http
  - monotools.runtime.realtime
  - "monoui"
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
