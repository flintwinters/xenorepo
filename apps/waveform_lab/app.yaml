name: waveform_lab
title: Waveform Lab
module: apps.waveform_lab.backend.server
imports:
  - monotools.orchestration.management
  - monotools.runtime.application
  - "monoui"
testing:
  python: tests
  browser:
    suite: tests/e2e/synthesizer.spec.ts
    proofs: [acceptance]
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
