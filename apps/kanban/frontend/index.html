<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanban Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, monospace;
        font-size: 12px;
        --bg: #1d2021;
        --plane: #282828;
        --plane-low: #222526;
        --line: #4b4a45;
        --text: #ebdbb2;
        --muted: #a89984;
        --red: #cc6654;
        --green: #98971a;
        --yellow: #d79921;
        --blue: #458588;
        --aqua: #689d6a;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      button, input { font: inherit; }

      button:focus-visible, input:focus-visible {
        outline: 2px solid #fabd2f;
        outline-offset: 1px;
      }

      .shell {
        display: grid;
        grid-template-rows: 32px minmax(0, 1fr) 21px;
        height: 100vh;
      }

      .utility, .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 9px;
        background: linear-gradient(#30302e, #242625);
        border-color: var(--line);
      }

      .utility { border-bottom: 1px solid var(--line); }
      .status { border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .brand { color: #fabd2f; letter-spacing: .08em; font-weight: 700; }
      .utility-note { color: var(--muted); font-size: 11px; }
      .connection { margin-left: auto; color: #b8bb26; }

      .board {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 0;
        padding: 0;
        background: #121414;
      }

      .column { min-width: 0; display: grid; grid-template-rows: 22px auto minmax(0, 1fr); background: var(--plane); }
      .column + .column { border-left: 1px solid #121414; }
      .pane-title {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 5px;
        color: #1d2021;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        box-shadow: inset 0 1px rgba(255,255,255,.18), inset 0 -1px rgba(0,0,0,.28), 0 2px 3px rgba(0,0,0,.25);
      }
      .column:nth-child(1) .pane-title { background: linear-gradient(#db9b2b 0 2px, var(--yellow) 2px calc(100% - 2px), #9d6b16 calc(100% - 2px)); }
      .column:nth-child(2) .pane-title { background: linear-gradient(#57999b 0 2px, var(--blue) 2px calc(100% - 2px), #326668 calc(100% - 2px)); }
      .column:nth-child(3) .pane-title { background: linear-gradient(#7bae7c 0 2px, var(--aqua) 2px calc(100% - 2px), #487649 calc(100% - 2px)); }
      .index { padding: 1px 4px; background: #202323; color: var(--text); font-weight: 400; }
      .count { margin-left: auto; font-weight: 400; }

      .cards { min-height: 0; overflow-y: auto; padding: 0; box-shadow: inset 0 0 0 1px transparent; }
      .cards.drop-target { background: #30312d; box-shadow: inset 0 0 0 1px #d79921; }
      .empty { margin: 12px 4px; color: #7c7b72; font-size: 11px; text-align: center; }
      .card { position: relative; padding: 5px 24px 4px 20px; border: 0; border-bottom: 1px solid #504f49; border-left: 2px solid #928374; background: var(--plane-low); box-shadow: 0 1px 2px rgba(0,0,0,.28); }
      .card:active { cursor: grabbing; }
      .card.dragging { opacity: .42; }
      .card.insert-before { box-shadow: inset 0 2px #fabd2f; }
      .card.insert-after { box-shadow: inset 0 -2px #fabd2f; }
      .card + .card { margin-top: 0; }
      .drag-handle { position: absolute; top: 4px; left: 4px; color: var(--muted); cursor: grab; line-height: 1; user-select: none; }
      .drag-handle:active { cursor: grabbing; }
      .card-title { margin: 0 0 4px; overflow-wrap: anywhere; line-height: 1.25; }
      .card-actions { position: absolute; top: 3px; right: 3px; }

      .modal-backdrop { position: fixed; z-index: 1; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
      .card-modal { width: min(440px, 100%); padding: 14px; border: 1px solid #6c6960; background: var(--plane); box-shadow: 0 12px 30px rgba(0,0,0,.55); }
      .card-modal-heading { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; }
      .card-modal-form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; }
      .card-modal-input { min-width: 0; padding: 4px 6px; border: 1px solid #55544e; border-radius: 1px; background: #171a1a; color: var(--text); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
      .card-modal-input[aria-invalid="true"] { border-color: var(--red); }

      .command {
        min-height: 19px;
        padding: 1px 5px;
        border: 1px solid #5d5c56;
        border-radius: 1px;
        background: linear-gradient(#3b3b38, #2b2d2c);
        color: var(--text);
        box-shadow: inset 0 1px rgba(255,255,255,.08), inset 0 -1px rgba(0,0,0,.4), 0 2px 2px rgba(0,0,0,.35);
        cursor: pointer;
      }
      .command:hover { background: linear-gradient(#464641, #303231); }
      .command:active { transform: translateY(1px); box-shadow: inset 0 -2px rgba(0,0,0,.5); }
      .command:disabled { opacity: .35; cursor: default; }
      .delete { min-width: 17px; min-height: 17px; padding: 0; color: #fb8b7d; font-size: 14px; line-height: 1; }

      .add-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; padding: 0; border-bottom: 1px solid var(--line); background: #242625; }
      .add-form label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .add-form input { min-width: 0; padding: 2px 5px; border: 1px solid #55544e; border-radius: 1px; background: #1b1e1e; color: var(--text); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
      .add-form input::placeholder { color: #77766e; }
      .error { color: #fb8b7d; }

      @media (max-width: 720px) {
        body { overflow: auto; }
        .shell { min-height: 100vh; height: auto; grid-template-rows: 30px auto 21px; }
        .utility-note { display: none; }
        .board { grid-template-columns: 1fr; }
        .column { min-height: 220px; }
        .cards { max-height: 40vh; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>/* APP_BUNDLE */</script>
  </body>
</html>
