name: microblog
title: WIRE/98
module: apps.microblog.backend.server
capabilities:
  - database
imports:
  - monotools.orchestration.management
  - monotools.persistence.auth
  - monotools.persistence.database
  - monotools.runtime.appkit
  - monotools.runtime.application
  - monotools.runtime.http
  - "monoui"
testing:
  python: tests
  browser:
    suite: tests/e2e/feed.spec.ts
    proofs: [acceptance, visual]
frontend:
  artifacts:
    index:
      format: preact
      source: frontend/index.tsx
      output: index.html
  routes:
    /: index
