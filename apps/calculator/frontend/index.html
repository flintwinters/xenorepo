<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket Calculator</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <p class="eyebrow">POCKET CALCULATOR</p>
      <output class="display" data-display aria-live="polite">0</output>
      <section class="keys" aria-label="Calculator keypad">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="sign">+/−</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-action="operator" data-value="÷">÷</button>
        <button data-action="digit" data-value="7">7</button><button data-action="digit" data-value="8">8</button><button data-action="digit" data-value="9">9</button><button class="operator" data-action="operator" data-value="×">×</button>
        <button data-action="digit" data-value="4">4</button><button data-action="digit" data-value="5">5</button><button data-action="digit" data-value="6">6</button><button class="operator" data-action="operator" data-value="−">−</button>
        <button data-action="digit" data-value="1">1</button><button data-action="digit" data-value="2">2</button><button data-action="digit" data-value="3">3</button><button class="operator" data-action="operator" data-value="+">+</button>
        <button class="zero" data-action="digit" data-value="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
      </section>
    </main>
    <script type="module" src="/assets/calculator.js"></script>
  </body>
</html>
