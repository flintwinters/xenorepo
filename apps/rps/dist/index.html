<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rock Paper Scissors</title>
<style>
:root{color-scheme:dark;--bg:#090b0d;--panel:#121619;--line:#3b4449;--ink:#edf0e8;--dim:#8d9697;--red:#ff5039;--gold:#ffc857;--cyan:#5de4e7;--green:#84d35c;font:15px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--ink)}body{display:grid;place-items:center;padding:clamp(10px,3vw,28px);background:radial-gradient(circle at 50% 0,#263036,transparent 45%)}button,input{font:inherit}.shell{width:min(980px,100%);border:1px solid #000;background:var(--panel);box-shadow:0 24px 80px #000}.bar,.hud,.queue,.players{display:flex;align-items:center;justify-content:space-between;gap:16px}.bar{padding:9px 14px;background:linear-gradient(#30383d,#171b1e);border-bottom:1px solid #000}.brand{color:var(--gold);font-weight:900;letter-spacing:.17em}.link{color:var(--green);font-size:.8rem}.link.offline{color:var(--red)}.hud,.queue{padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.identity{display:flex;gap:8px;flex:1;min-width:min(100%,300px)}input,button{min-height:44px;border:1px solid var(--line);background:#090c0e;color:var(--ink);padding:8px 12px}input{min-width:0;flex:1}button{cursor:pointer;font-weight:800}button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.presence,.queue-state{color:var(--dim)}.presence strong{color:var(--cyan)}.arena{padding:clamp(14px,3vw,28px)}.player{min-width:0}.player:last-child{text-align:right}.tag{color:var(--dim);font-size:.72rem;letter-spacing:.1em}.name{font-size:clamp(1.1rem,3vw,1.65rem);font-weight:900;overflow:hidden;text-overflow:ellipsis}.streak{color:var(--gold)}.versus{color:var(--red);font-size:1.4rem;font-weight:900}.timer{text-align:center;margin:12px auto 22px}.clock{font-size:clamp(3rem,12vw,7rem);font-weight:900;line-height:.9;color:var(--red);font-variant-numeric:tabular-nums}.clock.low{animation:pulse .55s infinite alternate}.round{color:var(--dim);letter-spacing:.12em}.throws{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.throw{min-height:112px;display:grid;place-items:center;align-content:center;gap:4px}.glyph{font-size:clamp(2rem,7vw,3.8rem);line-height:1}.key{color:var(--dim);font-size:.7rem}.throw.selected{border-color:var(--cyan);color:var(--cyan)}.message{min-height:52px;display:grid;place-items:center;text-align:center;color:var(--dim)}.result{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:18px;border:1px solid var(--line);background:#090c0e;text-align:center}.result[hidden]{display:none}.pick{font-size:clamp(2rem,8vw,4rem)}.outcome{color:var(--gold);font-weight:900}.ties{text-align:center;color:var(--dim);margin-top:12px}.feedback{min-height:27px;padding:5px 14px;color:var(--red);border-top:1px solid var(--line)}.reveal{animation:reveal .42s ease-out}@keyframes pulse{to{opacity:.4;transform:scale(.96)}}@keyframes reveal{from{transform:rotateY(90deg);opacity:0}}@media(max-width:560px){.presence{width:100%}.queue{align-items:stretch;flex-direction:column}.queue button{width:100%}.throws{gap:6px}.throw{padding:5px;min-height:96px}.result{padding:12px 5px}}
</style></head><body><main class="shell">
<header class="bar"><span class="brand">Rock Paper Scissors</span><span class="link offline" id="link">● OFFLINE</span></header>
<section class="hud"><form class="identity" id="profile"><input id="nickname" aria-label="Nickname" minlength="2" maxlength="24" required autocomplete="nickname"><button>SAVE</button></form><div class="presence"><strong id="online">0</strong> ONLINE</div></section>
<section class="queue"><span class="queue-state" id="queue-state">READY</span><button id="queue" disabled>JOIN QUEUE</button></section>
<section class="arena"><div class="players"><div class="player"><div class="tag">YOU · STREAK <span class="streak" id="streak">0</span></div><div class="name" id="you">——</div></div><div class="versus">VS</div><div class="player"><div class="tag">OPPONENT · STREAK <span class="streak" id="opponent-streak">0</span></div><div class="name" id="opponent">——</div></div></div>
<div class="timer"><div class="clock" id="clock">10</div><div class="round" id="round">STANDBY</div></div>
<div class="throws"><button class="throw" data-throw="rock" disabled><span class="glyph">●</span><span>ROCK</span><span class="key">1 / R</span></button><button class="throw" data-throw="paper" disabled><span class="glyph">▰</span><span>PAPER</span><span class="key">2 / P</span></button><button class="throw" data-throw="scissors" disabled><span class="glyph">✕</span><span>SCISSORS</span><span class="key">3 / S</span></button></div>
<div class="message" id="message" role="status" aria-live="polite">CONNECTING</div><div class="result" id="result" hidden><div><div class="tag">YOU</div><div class="pick" id="your-pick">?</div></div><div class="outcome" id="outcome">TIE</div><div><div class="tag">THEM</div><div class="pick" id="their-pick">?</div></div></div><div class="ties">TIES <span id="ties">0</span> / 5</div></section><div class="feedback" id="feedback" role="alert"></div></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll("[data-throw]")],icons={rock:"●",paper:"▰",scissors:"✕"};let socket,player={},mode="idle",submitted=false,ties=0,timer,retry;
const text=(id,value)=>$(id).textContent=value??"——";const fail=(value="")=>text("feedback",value);
function send(type,data={}){if(socket?.readyState!==1)return fail("CONNECTION LOST");socket.send(JSON.stringify({type,client_id:crypto.randomUUID(),...data}))}
function controls(){buttons.forEach(b=>b.disabled=mode!=="match"||submitted);$("queue").disabled=socket?.readyState!==1||mode==="match";text("queue",mode==="queued"?"LEAVE QUEUE":"JOIN QUEUE")}
function clock(deadline){clearInterval(timer);const end=deadline?Date.parse(deadline):Date.now()+10000,tick=()=>{const n=Math.max(0,Math.ceil((end-Date.now())/1000));text("clock",n);$("clock").classList.toggle("low",n<=3);if(!n)clearInterval(timer)};tick();timer=setInterval(tick,200)}
function round(data){mode="match";submitted=data.submitted;$("result").hidden=true;buttons.forEach(b=>b.classList.remove("selected"));text("round",`ROUND ${data.round}`);text("message",submitted?"THROW LOCKED · WAITING":data.opponent_submitted?"OPPONENT LOCKED · YOUR THROW":"CHOOSE YOUR THROW");clock(data.deadline);controls()}
function match(data){mode="match";const op=data.opponent;ties=0;text("opponent",op.nickname);text("opponent-streak",op.competitive_streak);text("ties",ties);text("queue-state",data.ranked?"RANKED MATCH":"MATCH FOUND");text("message","MATCH FOUND");controls()}
function reveal(data){clearInterval(timer);submitted=true;const throws=data.throws,mine=throws[player.id],theirs=Object.entries(throws).find(([id])=>id!==player.id)?.[1],out=data.outcome==="tie"?"tie":data.winner_id===player.id?"win":"loss";text("your-pick",icons[mine]);text("their-pick",icons[theirs]);text("outcome",out.toUpperCase());$("result").hidden=false;$("result").classList.remove("reveal");void $("result").offsetWidth;$("result").classList.add("reveal");if(data.outcome==="tie")ties++;text("ties",ties);text("message","REVEAL");controls()}
function playerView(data){player=data;text("you",data.nickname);text("streak",data.competitive_streak??0);$("nickname").value=data.nickname}
function apply(data){fail();if(data.type==="session")playerView(data.player);else if(data.type==="presence")text("online",data.count);else if(data.type==="queue_state"){mode=data.queued?"queued":"idle";text("queue-state",data.queued?"SEARCHING":"READY")}else if(data.type==="match_assignment")match(data);else if(data.type==="round_state")round(data);else if(data.type==="round_reveal")reveal(data);else if(data.type==="match_result"){mode="complete";clearInterval(timer);playerView(data.player);text("round","FINAL");text("message",data.outcome==="draw"?"DRAW":data.winner_id===player.id?"YOU WIN":"YOU LOSE");text("outcome",data.outcome==="draw"?"DRAW":data.winner_id===player.id?"WIN":"LOSS")}else if(data.type==="error")fail(data.message);controls()}
async function request(path,options){const response=await fetch(path,options),body=await response.json();if(!response.ok)throw Error(body.error||"REQUEST FAILED");return body}
async function connect(){try{playerView(await request("/api/session"));socket=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`);socket.onopen=()=>{$("link").classList.remove("offline");text("link","● ONLINE");text("message","READY");controls()};socket.onmessage=e=>{try{apply(JSON.parse(e.data))}catch{fail("INVALID SERVER MESSAGE")}};socket.onerror=()=>fail("CONNECTION ERROR");socket.onclose=()=>{$("link").classList.add("offline");text("link","● RECONNECTING");controls();retry=setTimeout(connect,2000)}}catch(error){fail(error.message);retry=setTimeout(connect,2000)}}
$("profile").addEventListener("submit",async e=>{e.preventDefault();try{playerView(await request("/api/session",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({nickname:$("nickname").value})}))}catch(error){fail(error.message)}});$("queue").onclick=()=>send(mode==="queued"?"queue_leave":"queue_join");buttons.forEach(b=>b.onclick=()=>{if(b.disabled)return;submitted=true;b.classList.add("selected");text("message","THROW LOCKED · WAITING");controls();send("throw",{selection:b.dataset.throw})});document.addEventListener("keydown",e=>{if(e.repeat||/INPUT|TEXTAREA/.test(e.target.tagName))return;const pick={1:"rock",r:"rock",2:"paper",p:"paper",3:"scissors",s:"scissors"}[e.key.toLowerCase()];if(pick)document.querySelector(`[data-throw=${pick}]`).click()});connect()})();
</script></body></html>
