<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="monotools-shell" content="console">
<title>WIRE/98</title>
<style>
/* monotools.frontend: console shell */
:root {
  color-scheme: dark;
  --bg: #1d2021;
  --panel: #282828;
  --well: #181a1b;
  --line: #504945;
  --hi: #665c54;
  --fg: #ebdbb2;
  --muted: #a89984;
  --red: #fb4934;
  --green: #b8bb26;
  --yellow: #fabd2f;
  --blue: #83a598;
  --purple: #d3869b;
  --aqua: #8ec07c;
  --orange: #fe8019;
  font: 12px/1.3 "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
button, input, textarea, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
.key:focus-visible, .tab:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 1px;
}
.utility, .status, .rail {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 2px 6px;
  background: linear-gradient(#3c3836, #282828);
  border-bottom: 1px solid #101112;
  white-space: nowrap;
  overflow: hidden;
}
.brand { color: var(--yellow); font-weight: bold; letter-spacing: .08em; }
.pane { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); }
.pane-body { min-height: 0; overflow: auto; }
.pane-title, .title {
  --chrome-rim: #b7cfca;
  --chrome-shade: #354a44;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 22px;
  margin: 0;
  padding-right: 7px;
  color: #1d2021;
  font-size: 12px;
  font-weight: bold;
  background: linear-gradient(#83a598, #5f7f75);
  border-top: 1px solid var(--chrome-rim);
  border-bottom: 2px solid var(--chrome-shade);
  box-shadow: 0 2px 2px #111;
}
.pane-title.green, .title.green {
  --chrome-rim: #d5d87a;
  --chrome-shade: #57580e;
}
.pane-title.orange, .title.orange {
  --chrome-rim: #ffaf66;
  --chrome-shade: #7a3307;
}
.pane-title.purple, .title.purple {
  --chrome-rim: #edb8c5;
  --chrome-shade: #65364c;
}
.index, .plaque {
  align-self: stretch;
  display: grid;
  place-items: center;
  min-width: 25px;
  padding: 0 5px;
  color: var(--fg);
  background: var(--panel);
  border-right: 1px solid #111;
}
.key, button {
  min-height: 20px;
  padding: 1px 8px;
  color: var(--fg);
  background: linear-gradient(#3c3836, #282828);
  border: 1px solid #111;
  border-top-color: #7c6f64;
  border-left-color: #665c54;
  box-shadow: inset -1px -1px #1d2021, 0 2px #101112;
  cursor: pointer;
}
.key:active, button:active, .key.pressed {
  transform: translateY(1px);
  box-shadow: inset 1px 1px #101112;
}
.key:disabled, button:disabled { color: #665c54; cursor: not-allowed; }
@media (max-width: 620px) {
  .utility .context, .rail .low, .status .hint { display: none; }
}
</style>
<style>
/* app-owned styles */
:root{--bg:#1d2021;--panel:#282828;--well:#1b1b1b;--fg:#ebdbb2;--muted:#a89984;--line:#504945;--dark:#141414;--red:#fb4934;--green:#b8bb26;--yellow:#fabd2f;--blue:#83a598;--purple:#d3869b;--aqua:#8ec07c;--orange:#fe8019}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px/1.35 "Courier New",monospace}body{overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{background:linear-gradient(#3c3836,#282828);border:1px solid #665c54;border-right-color:#141414;border-bottom-color:#141414;border-radius:0;box-shadow:inset 1px 1px #7c6f64,1px 2px #111;padding:3px 8px;cursor:pointer}button:active{transform:translate(1px,1px);box-shadow:inset 1px 1px #111}button:disabled{color:#665c54;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}.frame{height:100%;display:grid;grid-template-rows:29px 1fr 24px;border:1px solid #665c54}.rail{display:flex;align-items:center;gap:8px;padding:3px 6px;background:linear-gradient(#3c3836,#282828);border-bottom:1px solid #111;white-space:nowrap;overflow:hidden}.brand{color:var(--yellow);font-weight:bold;letter-spacing:1px}.summary{color:var(--muted);margin-right:auto}.workspace{min-height:0;display:grid;grid-template-columns:220px minmax(320px,1fr);gap:1px;background:var(--dark)}.pane{min-height:0;background:var(--panel);display:flex;flex-direction:column}.title{height:23px;flex:none;padding:3px 6px;color:#1d2021;font-weight:bold;background:linear-gradient(#b8bb26,#98971a);border-top:1px solid #d5c4a1;border-bottom:2px solid #3c3836;box-shadow:0 2px #161616}.title.blue{background:linear-gradient(#83a598,#458588)}.plaque{display:inline-block;background:#282828;color:var(--fg);padding:0 4px;margin-right:6px}.account-body{padding:9px;overflow:auto}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px}.tab{border:0;border-right:1px solid var(--line);box-shadow:none;background:transparent;color:var(--muted);padding:4px 8px}.tab.active{color:var(--fg);border-top:2px solid var(--orange);background:#32302f;box-shadow:0 2px #111}.field{display:block;margin:0 0 8px;color:var(--muted)}input,textarea{width:100%;margin-top:3px;background:var(--well);border:1px solid #111;border-top-color:#0b0b0b;border-left-color:#0b0b0b;border-right-color:#665c54;border-bottom-color:#665c54;padding:5px}form button{margin-right:5px}.signed{border:1px solid var(--line);padding:8px}.handle{color:var(--aqua);font-weight:bold}.hidden{display:none!important}.main{min-height:0;display:grid;grid-template-rows:auto 1fr}.composer{padding:8px;border-bottom:1px solid var(--dark)}textarea{height:62px;resize:none}.compose-row{display:flex;align-items:center;gap:8px;margin-top:5px}.counter{margin-left:auto;color:var(--muted)}.feed{overflow:auto;background:var(--well)}.post{padding:8px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#282828,#242424)}.post-head{display:flex;gap:8px;color:var(--muted);margin-bottom:4px}.post-author{color:var(--blue);font-weight:bold}.post-time{margin-left:auto}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.post-actions{margin-top:7px;display:flex;align-items:center;gap:7px}.liked{color:var(--red)}.empty{padding:24px;text-align:center;color:var(--muted)}.status{border-top:1px solid #665c54;border-bottom:0}.signal{color:var(--green)}#message{color:var(--yellow);overflow:hidden;text-overflow:ellipsis}.mobile-account{display:none}
.post{background:#282828}.auth-message{min-height:32px;margin-top:9px;border:1px solid var(--line);padding:6px;color:var(--muted)}.auth-message.error{color:var(--red);border-color:var(--red)}.auth-message button{margin-top:6px}
@media(max-width:620px){.workspace{grid-template-columns:1fr}.account{display:none}.account.mobile-open{display:flex;position:fixed;inset:29px 0 24px 0;z-index:3}.mobile-account{display:inline-block}.summary{display:none}.rail .low{display:none}.post-time{font-size:10px}.composer{padding:6px}.frame{grid-template-rows:29px 1fr 24px}}
</style>
</head>
<body>
<div class="frame">
<header class="rail"><span class="brand">WIRE/98</span><span class="summary">PUBLIC MICROBLOG CIRCUIT</span><span id="identity">GUEST</span><button class="mobile-account" id="accountCommand">ACCOUNT</button><button id="refresh">REFRESH</button></header>
<main class="workspace">
<aside class="pane account" aria-labelledby="account-title"><div class="title blue" id="account-title"><span class="plaque">01</span>ACCOUNT LINK</div><div class="account-body">
<div id="guest"><div class="tabs" role="tablist"><button class="tab active" id="loginTab" type="button">SIGN IN</button><button class="tab" id="registerTab" type="button">REGISTER</button></div>
<form id="authForm"><label class="field">HANDLE<input id="handle" autocomplete="username" minlength="3" maxlength="20" pattern="[a-z0-9_]+" required></label><label class="field">PASSWORD<input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label><button id="authSubmit">SIGN IN</button></form><div class="auth-message" id="authMessage" role="alert" aria-live="assertive">ENTER ACCOUNT CREDENTIALS</div></div>
<div id="signed" class="signed hidden"><div>LINK ACTIVE</div><p class="handle" id="signedHandle"></p><button id="logout">SIGN OUT</button></div></div></aside>
<section class="pane main" aria-labelledby="feed-title"><div><div class="title" id="feed-title"><span class="plaque">02</span>TRANSMISSION STREAM</div><form class="composer" id="postForm"><label for="body">NEW TRANSMISSION</label><textarea id="body" maxlength="280" placeholder="Sign in to publish." disabled></textarea><div class="compose-row"><button id="publish" disabled>PUBLISH</button><span id="composeHint">AUTHENTICATION REQUIRED</span><output class="counter" id="counter">0/280</output></div></form></div><div class="feed" id="feed" aria-live="polite"><div class="empty">SYNCING STREAM…</div></div></section>
</main>
<footer class="rail status"><span class="signal">● ONLINE</span><span id="message">READY</span><span class="summary"></span><span class="low">LAST SYNC:</span><time id="lastSync">NEVER</time></footer>
</div>
<script>
const $=id=>document.getElementById(id);let session={authenticated:false,account:null},mode="login",posts=[];
async function api(path,options={}){const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let data;try{data=await response.json()}catch{data={error:"Invalid server response."}}if(!response.ok)throw new Error(data.error||"Request failed.");return data}
function notice(text,bad=false){$("message").textContent=text;$("message").style.color=bad?"var(--red)":"var(--yellow)"}
function renderSession(){const active=session.authenticated;$("guest").classList.toggle("hidden",active);$("signed").classList.toggle("hidden",!active);$("identity").textContent=active?"@"+session.account.handle:"GUEST";$("signedHandle").textContent=active?"@"+session.account.handle:"";$("body").disabled=!active;$("publish").disabled=!active;$("body").placeholder=active?"What is on the wire?":"Sign in to publish.";$("composeHint").textContent=active?"READY":"AUTHENTICATION REQUIRED"}
function escapeText(value){const node=document.createElement("span");node.textContent=value;return node.innerHTML}
function renderPosts(){if(!posts.length){$("feed").innerHTML='<div class="empty">NO TRANSMISSIONS RECORDED</div>';return}$("feed").innerHTML=posts.map(post=>`<article class="post" data-id="${post.id}"><div class="post-head"><span class="post-author">@${escapeText(post.author)}</span><span>#${post.id}</span><time class="post-time">${new Date(post.created_at).toLocaleString()}</time></div><div class="post-body">${escapeText(post.body)}</div><div class="post-actions"><button class="like ${post.liked_by_me?'liked':''}" ${session.authenticated?'':'disabled'}>${post.liked_by_me?'UNLIKE':'LIKE'}</button><span>${post.like_count} SIGNAL${post.like_count===1?'':'S'}</span></div></article>`).join("")}
async function refresh(silent=false){try{posts=await api("/api/posts?limit=100");renderPosts();$("lastSync").textContent=new Date().toLocaleTimeString();if(!silent)notice("STREAM SYNCHRONIZED")}catch(error){notice(error.message,true)}}
async function loadSession(){try{session=await api("/api/session");renderSession();await refresh(true)}catch(error){notice(error.message,true)}}
function setAuthMessage(text,bad=false,offerRegistration=false){$("authMessage").classList.toggle("error",bad);$("authMessage").replaceChildren(document.createTextNode(text));if(offerRegistration){const button=document.createElement("button");button.type="button";button.textContent="REGISTER THIS HANDLE";button.onclick=()=>setMode("register");$("authMessage").append(document.createElement("br"),button)}}
function setMode(next){mode=next;$("loginTab").classList.toggle("active",mode==="login");$("registerTab").classList.toggle("active",mode==="register");$("authSubmit").textContent=mode==="login"?"SIGN IN":"REGISTER";$("password").autocomplete=mode==="login"?"current-password":"new-password";setAuthMessage(mode==="login"?"ENTER ACCOUNT CREDENTIALS":"CHOOSE NEW ACCOUNT CREDENTIALS")}
$("loginTab").onclick=()=>setMode("login");$("registerTab").onclick=()=>setMode("register");$("refresh").onclick=()=>refresh();$("accountCommand").onclick=()=>document.querySelector(".account").classList.toggle("mobile-open");
$("authForm").onsubmit=async event=>{event.preventDefault();const signingIn=mode==="login";setAuthMessage(signingIn?"SIGNING IN…":"REGISTERING…");try{session=await api(signingIn?"/api/sessions":"/api/accounts",{method:"POST",body:JSON.stringify({handle:$("handle").value,password:$("password").value})});$("password").value="";renderSession();renderPosts();notice(signingIn?"LINK ESTABLISHED":"ACCOUNT CREATED")}catch(error){$("password").value="";setAuthMessage(error.message,true,signingIn);$("password").focus();notice(signingIn?"SIGN-IN FAILED":"REGISTRATION FAILED",true)}};
$("logout").onclick=async()=>{try{session=await api("/api/session",{method:"DELETE"});document.querySelector(".account").classList.remove("mobile-open");renderSession();renderPosts();notice("LINK CLOSED")}catch(error){notice(error.message,true)}};
$("body").oninput=()=>$("counter").textContent=$("body").value.length+"/280";
$("body").onkeydown=event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing&&!event.repeat){event.preventDefault();$("postForm").requestSubmit()}};
$("postForm").onsubmit=async event=>{event.preventDefault();try{const post=await api("/api/posts",{method:"POST",body:JSON.stringify({body:$("body").value})});posts.unshift(post);$("body").value="";$("counter").textContent="0/280";renderPosts();notice("TRANSMISSION PUBLISHED")}catch(error){notice(error.message,true)}};
$("feed").onclick=async event=>{const button=event.target.closest(".like");if(!button)return;const article=button.closest(".post"),post=posts.find(item=>item.id===Number(article.dataset.id));try{const updated=await api(`/api/posts/${post.id}/like`,{method:post.liked_by_me?"DELETE":"PUT"});posts=posts.map(item=>item.id===updated.id?updated:item);renderPosts();notice(updated.liked_by_me?"SIGNAL ADDED":"SIGNAL REMOVED")}catch(error){notice(error.message,true)}};
function connectLiveFeed(){const events=new EventSource("/api/events");events.addEventListener("feed",()=>refresh(true));events.onerror=()=>notice("LIVE LINK RETRYING",true);events.onopen=()=>{if($("message").textContent==="LIVE LINK RETRYING")notice("LIVE LINK ACTIVE")}}
loadSession();connectLiveFeed();setInterval(()=>refresh(true),120000);
</script>
</body>
</html>
